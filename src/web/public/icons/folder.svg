<!-- The Prompt Chunks "New Category" glyph. Not traced from a screenshot and
     not guessed: the live element is an inline <svg> whose single path `d` was
     captured verbatim by npm run ui:prompt-chunks (stored.json), along with its
     viewBox and stroke attributes - so this is NAI's own artwork, not a
     lookalike. It is a plain folder outline; the surrounding UI reads as
     "folder+" but there is no plus in the path.

     Stroke, not fill: the source sets fill="none" stroke="currentColor". Since
     this is used through mask-image (which only reads alpha), the stroke is
     baked to #000 here - the mask takes the shape and .icon supplies the
     colour, exactly as the rest of the icon set works. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24"
     fill="none" stroke="#000" stroke-width="2" stroke-linecap="round"
     stroke-linejoin="round">
  <path d="M4 20h16a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7.93a2 2 0 0 1-1.66-.9l-.82-1.2A2 2 0 0 0 7.93 3H4a2 2 0 0 0-2 2v13c0 1.1.9 2 2 2Z"/>
</svg>
