<!-- Stroke 4, not 2.5. This glyph is only ever drawn small - 9px inside the
     Normalize checkbox, 12px on a vibe slot's use/skip button - and at those
     sizes 2.5/24 lands under a pixel of ink, which read as a hairline against
     NAI's noticeably chunkier tick. Square caps for the same reason: round
     ones erode the ends of an already-short stroke. -->
<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="square" stroke-linejoin="miter" xmlns="http://www.w3.org/2000/svg">
<path d="M4.5 12.5l5 5l9.5 -9.5"/>
</svg>
